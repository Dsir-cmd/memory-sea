# ============================================================================
# memory-sea 的 bundle patch —— 把记忆海挂进 DSH 配置树
# ----------------------------------------------------------------------------
# insert: 新增插件行；id 与包名一致，便于插件管理器按 entry id 对应。
# name:   解析到包入口 index.js（宿主半侧）。
# 包内 package.json 的 dsh.client 声明会让 DSH 同时把 ./client.js 作为
# 浏览器插件加载，左侧导航里的「记忆海」由它注册。
# ============================================================================
- insert:
    - id: dsh-memory-sea
      name: 'dsh-memory-sea'
      config: {}
